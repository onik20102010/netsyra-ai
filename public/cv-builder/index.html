<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#f4f5f7">
  <title>CV Builder Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/cv-builder/css/style.css">
  <link rel="stylesheet" href="/cv-builder/css/features.css">
  <link rel="stylesheet" href="/cv-builder/css/responsive.css">
</head>
<body>

  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <span class="app-logo"><i class="fas fa-file-lines"></i> CV Builder Pro</span>
      </div>
      <div class="header-right">
        <button class="btn btn-ghost" id="restartBtn" onclick="restart()" title="Start over">
          <i class="fas fa-rotate-left"></i>
        </button>
      </div>
    </header>

    <!-- Progress bar -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText">Step 1 of 17</span>
    </div>

    <!-- Main content area -->
    <main class="app-main" id="appMain">
      <!-- Pages rendered here by JS -->
    </main>

    <!-- Navigation buttons -->
    <footer class="app-footer" id="appFooter">
      <button class="btn btn-secondary" id="backBtn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> Back
      </button>
      <div class="footer-spacer"></div>
      <button class="btn btn-skip" id="skipBtn" onclick="skipPage()">
        Skip <i class="fas fa-forward"></i>
      </button>
      <button class="btn btn-primary" id="nextBtn" onclick="goNext()">
        Next <i class="fas fa-arrow-right"></i>
      </button>
    </footer>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Page scripts -->
  <script src="/cv-builder/js/pages/personal.js"></script>
  <script src="/cv-builder/js/pages/summary.js"></script>
  <script src="/cv-builder/js/pages/experience.js"></script>
  <script src="/cv-builder/js/pages/education.js"></script>
  <script src="/cv-builder/js/pages/skills.js"></script>
  <script src="/cv-builder/js/pages/projects.js"></script>
  <script src="/cv-builder/js/pages/certifications.js"></script>
  <script src="/cv-builder/js/pages/languages.js"></script>
  <script src="/cv-builder/js/pages/awards.js"></script>
  <script src="/cv-builder/js/pages/volunteer.js"></script>
  <script src="/cv-builder/js/pages/internships.js"></script>
  <script src="/cv-builder/js/pages/publications.js"></script>
  <script src="/cv-builder/js/pages/conferences.js"></script>
  <script src="/cv-builder/js/pages/references.js"></script>
  <script src="/cv-builder/js/pages/interests.js"></script>
  <script src="/cv-builder/js/pages/social.js"></script>
  <script src="/cv-builder/js/pages/custom.js"></script>

  <!-- Template scripts -->
  <script src="/cv-builder/js/templates/classic.js"></script>
  <script src="/cv-builder/js/templates/modern.js"></script>
  <script src="/cv-builder/js/templates/minimal.js"></script>
  <script src="/cv-builder/js/templates/professional.js"></script>
  <script src="/cv-builder/js/templates/modern-warm.js"></script>
  <script src="/cv-builder/js/templates/split-sidebar.js"></script>
  <script src="/cv-builder/js/templates/munich-executive.js"></script>
  <script src="/cv-builder/js/templates/boho-arched.js"></script>
  <script src="/cv-builder/js/templates/split-charcoal.js"></script>
  <script src="/cv-builder/js/templates/early-career-functional.js"></script>
  <script src="/cv-builder/js/templates/modern-pill-cards.js"></script>
  <script src="/cv-builder/js/templates/classic-functional-cv.js"></script>
  <script src="/cv-builder/js/templates/split-sidebar-functional.js"></script>
  <script src="/cv-builder/js/templates/gradient-accent-resume.js"></script>
  <script src="/cv-builder/js/templates/dark-chevron-sidebar.js"></script>
  <script src="/cv-builder/js/templates/emerald-pill-sidebar.js"></script>

  <!-- Custom Template & Self-Made Editor -->
  <script src="/cv-builder/js/custom-template.js"></script>
  <script src="/cv-builder/js/self-made.js"></script>

  <!-- AI Suggestions, DOCX Export, Cover Letter, Resume Score -->
  <script src="/cv-builder/js/ai-suggestions.js"></script>
  <script src="/cv-builder/js/docx-export.js"></script>
  <script src="/cv-builder/js/cover-letter.js"></script>
  <script src="/cv-builder/js/resume-scoring.js"></script>

  <!-- Main app -->
  <script src="/cv-builder/js/app.js"></script>
</body>
</html>
